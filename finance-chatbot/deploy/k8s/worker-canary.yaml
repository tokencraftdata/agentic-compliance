# Canary worker for releases (scripts/rollout.py): same pod spec as finbot-worker, scaled from 0
# by the rollout script while a new version bakes. Not autoscaled; the rollout sets its replicas.
# Queue workers: stateless, interchangeable, scaled on queue depth.
# Any pod can serve any session; the session lease in DynamoDB decides who owns
# a session right now, and the compare-and-swap commit rejects a late writer.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: finbot-worker-canary
  namespace: finbot
spec:
  replicas: 0
  selector:
    matchLabels: {app: finbot-worker, track: canary}
  strategy:
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  template:
    metadata:
      labels: {app: finbot-worker, track: canary}
    spec:
      serviceAccountName: finbot-worker
      automountServiceAccountToken: true          # needed for IRSA web identity
      # Longer than turn_deadline_s (90 s) plus one long poll (20 s): SIGTERM lets the
      # turn in hand finish. A pod killed anyway loses only an uncommitted turn.
      terminationGracePeriodSeconds: 120
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: {app: finbot-worker, track: canary}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: worker
          image: REGISTRY/finbot:VERSION
          command: ["python", "-m", "finbot.worker_main"]
          envFrom:
            - configMapRef: {name: finbot-config}
          env:
            - {name: FINBOT_HEARTBEAT_FILE, value: /tmp/heartbeat}
          # Liveness: the loop touches the heartbeat after every poll (a long poll
          # returns within 20 s; one turn takes at most ~90 s).
          livenessProbe:
            exec:
              command: ["python", "-c", "import os,sys,time; sys.exit(time.time()-os.path.getmtime('/tmp/heartbeat') > 150)"]
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {memory: 1Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {}
