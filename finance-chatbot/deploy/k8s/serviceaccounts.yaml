# One identity per role. Each maps to its own IAM role (IRSA shown; EKS Pod
# Identity works the same way). Least privilege per role is listed in
# docs/design.md section 10. Replace ACCOUNT_ID.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: finbot-worker
  namespace: finbot
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/finbot-worker
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: finbot-api
  namespace: finbot
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/finbot-api
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: finbot-ingest
  namespace: finbot
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT_ID:role/finbot-ingest
