# Weekly update PRs for Python dependencies, the base image and the CI actions themselves.
version: 2
updates:
  - package-ecosystem: pip
    directories: ["/", "/infra/cdk"]
    schedule: {interval: weekly}
    groups: {python: {patterns: ["*"]}}
  - package-ecosystem: docker
    directory: /
    schedule: {interval: weekly}
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
