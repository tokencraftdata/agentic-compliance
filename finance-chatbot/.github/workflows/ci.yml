# Build checks on every push and pull request: lint (including bandit security rules),
# types, unit tests, the eval splits and the red team. A regression in any of them fails.
name: ci
on:
  push: {branches: [main]}
  pull_request:
permissions: {contents: read}
concurrency: {group: "ci-${{ github.ref }}", cancel-in-progress: true}

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt ruff mypy -r infra/cdk/requirements.txt
      - run: ruff check .
      - run: mypy finbot
      - run: python -m unittest discover -s tests
      - name: production image dependency smoke test
        run: |
          docker build -t finbot:ci .
          docker run --rm --network none --entrypoint python finbot:ci -c 'import jwt, opensearchpy, gunicorn'
      - run: python scripts/run_eval.py --data data
      - run: python scripts/run_eval.py --data data/test
      - name: red team (fails if any attack succeeds against the defended configuration)
        run: python scripts/run_redteam.py | tee redteam.txt && grep -E '^defended +0/' redteam.txt
