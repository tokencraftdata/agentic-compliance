[project]
name = "finbot"
version = "0.4.0"
description = "Guarded fintech support chatbot: the model drafts, code verifies (synthetic data only)"
requires-python = ">=3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
# pyflakes, pycodestyle, isort, bugbear, pyupgrade, simplify, comprehensions
select = ["F", "E", "W", "I", "B", "UP", "SIM", "C4", "S"]   # S: bandit security rules
ignore = [
    "S101",    # assert narrows types for mypy; no security check relies on one
    "S311",    # random is used for jitter, simulation and synthetic data, never for secrets
    "SIM105",  # contextlib.suppress: explicit try/except reads better around I/O here
    "SIM108",  # ternaries everywhere hurt readability
    "SIM905",  # word lists read better as one string split on whitespace
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402"]
"infra/*" = ["E402"]   # scripts put the repo on sys.path before importing finbot
"finbot/orchestrator.py" = ["E501"]   # the system prompt is prose, one rule per line
"tests/*" = ["E402", "S105", "S106", "S108", "S110", "S310", "S324", "S603"]   # test fixtures: fake secrets, temp paths

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

# The processor-orchestration and adaptive-guardrail packages are fully typed and checked strictly.
[[tool.mypy.overrides]]
module = ["finbot.processors.*", "finbot.adaptive.*"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
warn_return_any = true
