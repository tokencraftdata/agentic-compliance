<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 730" width="1200" height="730" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
    <style>
      .t { font-size: 13px; font-weight: 600; fill: #0F172A; }
      .s { font-size: 11px; fill: #475569; }
      .m { font-family: ui-monospace, 'SF Mono', Menlo, monospace; font-size: 12px; fill: #0F172A; }
      .band { font-size: 11px; font-weight: 700; letter-spacing: 0.08em; fill: #64748B; }
      .note { font-size: 11px; fill: #64748B; }
      .chip { font-size: 10px; font-weight: 600; fill: #6D28D9; }
      .ln { stroke: #475569; stroke-width: 1.4; fill: none; }
      .data { fill: #EEF2F7; stroke: #94A3B8; }
      .guard { fill: #FEF3E2; stroke: #D97706; }
      .mem { fill: #E6F4F1; stroke: #0F766E; }
      .llm { fill: #EFEAFB; stroke: #6D28D9; }
      .user { fill: #F1F5F9; stroke: #475569; }
      .qual { fill: #F5F5F4; stroke: #78716C; }
    </style>
  </defs>
  <rect width="1200" height="730" fill="#FFFFFF"/>

  <text x="40" y="38" style="font-size:20px;font-weight:700;fill:#0F172A">finbot: guarded finance support chatbot</text>
  <text x="40" y="58" class="note">Amazon Bedrock (Claude + Guardrails) · model engine with circuit breakers · evidence guard with repair · durable sessions, crash recovery</text>

  <!-- Band A: offline data -->
  <text x="40" y="92" class="band">OFFLINE · DATA AND KNOWLEDGE</text>
  <rect x="40" y="102" width="250" height="60" rx="8" class="data"/>
  <text x="56" y="127" class="t">Help docs (S3 / wiki)</text>
  <text x="56" y="146" class="s">markdown / HTML, versioned</text>
  <rect x="330" y="102" width="250" height="60" rx="8" class="data"/>
  <text x="346" y="127" class="t">ingest.py</text>
  <text x="346" y="146" class="s">heading chunks, version-aware upsert</text>
  <rect x="620" y="102" width="250" height="60" rx="8" class="data"/>
  <text x="636" y="127" class="t">KB index · knowledge.py</text>
  <text x="636" y="146" class="s">BM25 + Titan embeddings, access groups</text>
  <rect x="910" y="102" width="250" height="60" rx="8" class="data" stroke-dasharray="5 3"/>
  <text x="926" y="127" class="t">generate_synthetic.py</text>
  <text x="926" y="146" class="s">seeded: 600 txns, 2,003 log events</text>
  <path d="M290,132 L328,132" class="ln" marker-end="url(#arr)"/>
  <path d="M580,132 L618,132" class="ln" marker-end="url(#arr)"/>

  <!-- Band B: one turn -->
  <text x="40" y="200" class="band">ONLINE · ONE CHAT TURN · runtime.py worker → orchestrator.py</text>
  <rect x="40" y="212" width="150" height="86" rx="8" class="user"/>
  <text x="54" y="236" class="t">User / support</text>
  <text x="54" y="256" class="s">authenticated session</text>
  <text x="54" y="271" class="s">sets tenant_id</text>

  <rect x="216" y="212" width="150" height="86" rx="8" class="guard"/>
  <text x="230" y="236" class="t">Input guardrail</text>
  <text x="230" y="256" class="s">prompt attack, PII mask</text>
  <text x="230" y="271" class="s">denied topics</text>
  <text x="230" y="289" class="chip">● Bedrock Guardrails</text>

  <rect x="392" y="212" width="150" height="86" rx="8" class="mem"/>
  <text x="406" y="236" class="t">Focus + state</text>
  <text x="406" y="256" class="s">memory.py: per-txn</text>
  <text x="406" y="271" class="s">ledger, focus set in code</text>

  <rect x="568" y="212" width="150" height="86" rx="8" class="llm"/>
  <text x="582" y="236" class="t">Model engine</text>
  <text x="582" y="256" class="s">models.py: failover chain</text>
  <text x="582" y="271" class="s">breaker per model, routing</text>
  <text x="582" y="289" class="chip">● east → west → Claude API</text>

  <rect x="744" y="212" width="150" height="86" rx="8" class="guard"/>
  <text x="758" y="236" class="t">Evidence guard</text>
  <text x="758" y="256" class="s">amounts, codes, txn ids</text>
  <text x="758" y="271" class="s">must be in tool data</text>

  <rect x="920" y="212" width="150" height="86" rx="8" class="guard"/>
  <text x="934" y="236" class="t">Output guardrail</text>
  <text x="934" y="256" class="s">contextual grounding</text>
  <text x="934" y="271" class="s">+ PII masking</text>
  <text x="934" y="289" class="chip">● Bedrock Guardrails</text>

  <rect x="1096" y="226" width="74" height="58" rx="29" class="user"/>
  <text x="1133" y="252" class="t" text-anchor="middle">Answer</text>
  <text x="1133" y="268" class="s" text-anchor="middle">+ sources</text>

  <path d="M190,255 L214,255" class="ln" marker-end="url(#arr)"/>
  <path d="M366,255 L390,255" class="ln" marker-end="url(#arr)"/>
  <path d="M542,255 L566,255" class="ln" marker-end="url(#arr)"/>
  <path d="M718,255 L742,255" class="ln" marker-end="url(#arr)"/>
  <path d="M894,255 L918,255" class="ln" marker-end="url(#arr)"/>
  <path d="M1070,255 L1094,255" class="ln" marker-end="url(#arr)"/>
  <text x="744" y="320" class="note">still blocked → safe "won't guess" fallback</text>
  <path d="M800,212 L800,198 L690,198 L690,210" class="ln" stroke-dasharray="4 3" marker-end="url(#arr)"/>
  <text x="808" y="205" class="chip" style="fill:#B45309">repair once (verifier feedback)</text>

  <!-- Tools bus -->
  <path d="M643,298 L643,372" class="ln"/>
  <path d="M423,372 L853,372" class="ln"/>
  <path d="M423,372 L423,390" class="ln" marker-end="url(#arr)"/>
  <path d="M643,372 L643,390" class="ln" marker-end="url(#arr)"/>
  <path d="M853,372 L853,390" class="ln" marker-end="url(#arr)"/>

  <rect x="328" y="392" width="190" height="52" rx="8" class="user"/>
  <text x="423" y="423" class="m" text-anchor="middle">get_transaction</text>
  <rect x="548" y="392" width="190" height="52" rx="8" class="user"/>
  <text x="643" y="423" class="m" text-anchor="middle">search_transaction_logs</text>
  <rect x="758" y="392" width="190" height="52" rx="8" class="user"/>
  <text x="853" y="423" class="m" text-anchor="middle">search_knowledge_base</text>
  <path d="M423,444 L423,482" class="ln" marker-end="url(#arr)"/>
  <path d="M643,444 L643,482" class="ln" marker-end="url(#arr)"/>
  <path d="M853,444 L853,482" class="ln" marker-end="url(#arr)"/>

  <rect x="328" y="484" width="190" height="56" rx="8" class="data"/>
  <text x="344" y="507" class="t">Transaction DB</text>
  <text x="344" y="526" class="s">demo: transactions.jsonl</text>
  <rect x="548" y="484" width="190" height="56" rx="8" class="data"/>
  <text x="564" y="507" class="t">Log search (ES)</text>
  <text x="564" y="526" class="s">demo: logs.jsonl</text>
  <rect x="758" y="484" width="190" height="56" rx="8" class="data"/>
  <text x="774" y="507" class="t">KB index</text>
  <text x="774" y="526" class="s">built from kb_pages.json</text>
  <text x="328" y="560" class="note">Tools are read-only (found / not_found / error); tenant comes from the session, never the model. Swap demo files for a DB / log store / MCP.</text>

  <!-- Session store (left) -->
  <rect x="40" y="392" width="262" height="148" rx="10" fill="#F0FDFA" stroke="#0F766E"/>
  <text x="56" y="416" class="t">Session store · store.py</text>
  <text x="56" y="438" class="s">versioned case record + idle TTL</text>
  <text x="56" y="456" class="s">lease + compare-and-swap commit</text>
  <text x="56" y="474" class="s">turn journal: dedupe by msg_id</text>
  <text x="56" y="492" class="s">action journal: unknown → reconcile</text>
  <text x="56" y="526" class="note">SQLite here · DynamoDB / Postgres in prod</text>
  <path d="M250,392 L250,340 L467,340 L467,300" class="ln" stroke-dasharray="4 3" marker-start="url(#arr)" marker-end="url(#arr)"/>
  <text x="262" y="334" class="note">load / commit each turn</text>

  <!-- Bedrock (right) -->
  <rect x="968" y="392" width="202" height="148" rx="10" fill="#FAF8FF" stroke="#6D28D9"/>
  <text x="982" y="416" class="t">Amazon Bedrock</text>
  <rect x="982" y="426" width="174" height="24" rx="6" class="llm"/>
  <text x="992" y="442" class="s">Claude · multi-region chain</text>
  <rect x="982" y="456" width="174" height="24" rx="6" class="guard"/>
  <text x="992" y="472" class="s">Guardrails · ApplyGuardrail</text>
  <rect x="982" y="486" width="174" height="24" rx="6" class="data"/>
  <text x="992" y="502" class="s">Titan Embed v2 (optional)</text>
  <text x="982" y="528" class="note">alt: Claude API / gateway</text>

  <!-- Band E: quality loop -->
  <text x="40" y="584" class="band">QUALITY LOOP</text>
  <rect x="40" y="596" width="250" height="64" rx="8" class="qual"/>
  <text x="56" y="621" class="t">audit.jsonl</text>
  <text x="56" y="640" class="s">per turn: masked text, tools,</text>
  <text x="56" y="654" class="s">guard reasons, latency</text>
  <rect x="330" y="596" width="250" height="64" rx="8" class="qual"/>
  <text x="346" y="621" class="t">review_queue.jsonl</text>
  <text x="346" y="640" class="s">user ratings → human review</text>
  <rect x="620" y="596" width="250" height="64" rx="8" class="qual"/>
  <text x="636" y="621" class="t">Fix in source docs</text>
  <text x="636" y="640" class="s">re-ingested by version; never</text>
  <text x="636" y="654" class="s">auto-ingest model answers</text>
  <rect x="910" y="596" width="250" height="64" rx="8" class="qual" stroke-dasharray="5 3"/>
  <text x="926" y="621" class="t">run_eval.py</text>
  <text x="926" y="640" class="s">19 cases + --hallucinate stress</text>
  <text x="926" y="654" class="s">deterministic checks, no LLM judge</text>
  <path d="M580,628 L618,628" class="ln" marker-end="url(#arr)"/>

  <text x="40" y="700" class="note">Dashed boxes = synthetic data path (scripts/generate_synthetic.py → data/). Colours: amber = guardrails, purple = model, teal = memory/state, grey-blue = data. Dashed arrows: repair loop, session persistence.</text>
</svg>
